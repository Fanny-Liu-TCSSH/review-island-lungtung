<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第二次段考複習島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#cfe6e8; --panel:rgba(255,252,247,.86); --panel-solid:#fffcf7; --sheet:#fffcf7; --card:#fff8f2; --card-line:#f0dfd2;
  --ink:#2b2622; --muted:#7a6f66; --line:rgba(120,90,60,.13); --track:#f1dfd3;
  --coral:#e07a55; --coral-ink:#c25a35; --on-coral:#ffffff; --coral-soft:#fbe9e0;
  --mint:#6aa89b; --mint-soft:#e8f3ef; --gold:#d9a62e; --gold-soft:#fdf1d4; --ok:#3f8f6b; --ok-soft:#e3f3ea; --bad:#c2473a; --bad-soft:#fbe5e1;
  --tag-bg:rgba(255,253,249,.94); --tag-ink:#2b2622; --tag-muted:#7a6f66;
  --scrim:rgba(40,46,52,.38);
  --shadow:0 18px 40px -18px rgba(60,40,20,.38);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d2433; --panel:rgba(30,34,46,.86); --panel-solid:#1e222e; --sheet:#20242f; --card:#272c38; --card-line:#353b49;
    --ink:#f3ede6; --muted:#b8afa5; --line:rgba(255,255,255,.08); --track:rgba(255,255,255,.12);
    --coral-soft:#3f2e2a; --mint-soft:#24332f; --gold-soft:#3a3222; --ok:#7fcfa6; --ok-soft:#22362c; --bad:#f19a8c; --bad-soft:#3d2724;
    --scrim:rgba(5,8,14,.55); --shadow:0 18px 40px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2433; --panel:rgba(30,34,46,.86); --panel-solid:#1e222e; --sheet:#20242f; --card:#272c38; --card-line:#353b49;
  --ink:#f3ede6; --muted:#b8afa5; --line:rgba(255,255,255,.08); --track:rgba(255,255,255,.12);
  --coral-soft:#3f2e2a; --mint-soft:#24332f; --gold-soft:#3a3222; --ok:#7fcfa6; --ok-soft:#22362c; --bad:#f19a8c; --bad-soft:#3d2724;
  --scrim:rgba(5,8,14,.55); --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.index{position:fixed;z-index:3;left:calc(20px + env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px));
  width:min(380px,calc(100vw - 40px));padding:22px 24px 20px;background:var(--panel);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
  border-radius:26px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--coral-ink)}
.eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(224,122,85,.2)}
.index h1{font-size:clamp(26px,3vw,36px);font-weight:900;margin:12px 0 8px;line-height:1.15;letter-spacing:.01em}
.lede{font-size:14px;line-height:1.75;color:var(--muted);margin:0 0 16px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#eab07a,var(--coral));transition:width .6s ease}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.tools{position:fixed;z-index:3;right:calc(20px + env(safe-area-inset-right,0px));top:calc(20px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.tool{width:48px;height:48px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .15s ease,background .2s}
.tool:hover{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--coral);color:var(--on-coral)}
.tool svg{width:22px;height:22px}
.player{height:48px;padding:0 18px 0 6px;border:0;border-radius:99px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;cursor:pointer;
  background:var(--panel);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.player .dot{width:36px;height:36px;border-radius:50%;background:var(--coral);color:var(--on-coral);display:grid;place-items:center}
.player .dot svg{width:18px;height:18px}

.clock{position:fixed;z-index:3;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:99px;background:var(--panel);
  box-shadow:var(--shadow),inset 0 0 0 1px var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.clock time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:0 10px 0 2px;min-width:58px}
.clock .play{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--panel-solid);display:grid;place-items:center;cursor:pointer}
.clock .play svg{width:14px;height:14px}
.clock .jump{border:0;background:transparent;border-radius:99px;padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.clock .jump:hover{background:var(--track);color:var(--ink)}
.hint{position:fixed;z-index:3;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  font-size:12px;color:var(--muted);background:var(--panel);padding:9px 14px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line)}
.hint .touch{display:none}
@media (pointer:coarse){.hint .mouse{display:none}.hint .touch{display:inline}}

#tags{position:fixed;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;white-space:nowrap;
  background:var(--tag-bg);color:var(--tag-ink);border-radius:16px;padding:7px 14px 8px;text-align:center;line-height:1.35;
  box-shadow:0 10px 22px -12px rgba(60,40,20,.55);transition:box-shadow .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tag b{color:var(--coral-ink);font-weight:700;font-size:13px}
.tag small{font-size:13px;color:var(--tag-muted);margin-left:4px;font-variant-numeric:tabular-nums}
.tag em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--coral);border-radius:99px;padding:1px 7px;margin-left:6px}
.tag span{display:block;font-size:14px;font-weight:500;position:relative;z-index:1}
.tag.is-hover{box-shadow:0 0 0 2px var(--coral),0 12px 26px -12px rgba(60,40,20,.6)}
.tag.is-done b{color:var(--gold)}
.tag.mag{padding:5px 11px 6px;border-radius:13px}
.tag.mag b{color:var(--mint);font-size:12px}
.tag.mag small{font-size:12px}
.tag.mag span{font-size:13px}
body.no-tags .tag{display:none}

.toast{position:fixed;z-index:40;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;
  background:var(--panel-solid);color:var(--ink);padding:12px 18px;border-radius:16px;font-size:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);
  transition:opacity .25s, transform .25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);transition:opacity .7s ease}
.loader p{margin:0;font-size:16px;font-weight:700}
.loader small{display:block;margin-top:6px;font-size:13px;font-weight:400;color:var(--muted);text-align:center}
.loader.done{opacity:0;pointer-events:none}

/* ---------- sheets (modals) ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.scrim[hidden]{display:none}
.sheet{position:relative;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);
  border-radius:32px;box-shadow:0 30px 80px -30px rgba(30,20,10,.55);overflow:hidden}
.sheet.narrow{width:min(760px,100%)}
.sheet-body{overflow:auto;padding:44px 52px 24px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:12px;justify-content:flex-end;align-items:center;padding:16px 52px 28px;background:linear-gradient(to bottom,transparent,var(--sheet) 30%)}
.sheet-foot .grow{flex:1;font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:18px;padding:15px 26px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .12s ease,filter .2s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--coral);color:var(--on-coral);box-shadow:0 10px 22px -10px rgba(224,122,85,.8)}
.btn-ghost{background:var(--coral-soft);color:var(--ink)}
.btn-gold{background:#f6d77e;color:#2b2622}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.x{position:absolute;right:18px;top:18px;width:40px;height:40px;border:0;border-radius:50%;background:var(--coral-soft);cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px}

/* login */
.login .badge{width:112px;height:112px;border-radius:30px;background:#f6d77e;display:grid;place-items:center;box-shadow:inset 0 -10px 0 rgba(0,0,0,.06)}
.login .badge svg{width:46px;height:46px;color:#2b2622}
.login h2{font-size:clamp(32px,4.4vw,52px);font-weight:900;margin:26px 0 14px;line-height:1.1}
.login .intro{font-size:17px;line-height:1.85;color:var(--muted);margin:0 0 28px;max-width:56ch}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 30px;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--coral-soft);border-radius:22px;padding:20px 22px;font-size:15px;line-height:1.7;color:var(--muted);counter-increment:s}
.steps li::before{content:counter(s,decimal-leading-zero);display:block;font-size:26px;font-weight:700;color:var(--coral-ink);margin-bottom:8px}
.fields{display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
.field input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--card-line);border-radius:16px;padding:14px 16px}
.field input:focus{border-color:var(--coral);outline:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}

/* pack */
.pack-head{display:flex;gap:22px;align-items:flex-start}
.pack-icon{flex:0 0 auto;width:104px;height:104px;border-radius:26px;display:grid;place-items:center;font-size:50px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.pack-head .eyebrow{margin-top:4px}
.pack-head h2{font-size:clamp(30px,4vw,48px);font-weight:900;margin:6px 0 4px;line-height:1.12}
.pack-head .en{font-size:18px;color:var(--muted)}
.pack-score{margin-left:auto;flex:0 0 auto;text-align:center;background:var(--coral-soft);border-radius:22px;padding:14px 18px;min-width:104px}
.pack-score b{display:block;font-size:34px;font-style:italic;font-family:Georgia,"Times New Roman",serif;line-height:1}
.pack-score span{font-size:13px;color:var(--muted)}
.lead-box{margin:30px 0 8px;background:var(--mint-soft);border-left:6px solid var(--mint);border-radius:22px;padding:20px 26px;font-size:17px;line-height:1.85}
.sec{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
.sec i{width:46px;height:46px;border-radius:14px;background:var(--coral-soft);display:grid;place-items:center;font-style:normal;font-size:22px}
.sec h3{margin:0;font-size:24px;font-weight:900}
.bul{margin:0;padding-left:22px;font-size:17px;line-height:1.9}
.bul li{margin:4px 0}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.word{text-align:left;border:2px solid var(--card-line);background:var(--card);border-radius:20px;padding:16px 18px;cursor:pointer;transition:border-color .2s,transform .12s}
.word:hover{border-color:var(--coral)}
.word.say{transform:scale(.98);border-color:var(--coral)}
.word b{display:block;font-size:21px;font-weight:700}
.word .pos{display:block;font-size:14px;font-weight:700;color:var(--coral-ink);margin:4px 0 6px}
.word .zh{display:block;font-size:16px;color:var(--muted)}
.word .col{display:block;font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--card-line);padding-top:8px}
.say-note{font-size:13px;color:var(--muted);margin:12px 0 0}
.phrases{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.phrase{padding:14px 0;border-bottom:1px solid var(--card-line)}
.phrase b{display:block;font-size:19px;font-weight:700}
.phrase span{font-size:15px;color:var(--muted)}
.pattern{background:var(--gold-soft);border-radius:22px;padding:20px 24px;margin-bottom:14px}
.pattern code{display:inline-block;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:700;font-size:16px;color:#8a5a12;background:var(--sheet);border-radius:10px;padding:6px 12px}
.pattern p{margin:12px 0 0;font-size:16px;line-height:1.75}
.pattern blockquote{margin:10px 0 0;padding-left:14px;border-left:4px solid #e9c46a;font-style:italic;font-size:16px;line-height:1.7}
.tasks{display:grid;gap:14px}
.task{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border:2px solid var(--card-line);background:var(--card);border-radius:22px;padding:18px 22px;cursor:pointer;transition:border-color .2s}
.task:hover{border-color:var(--coral)}
.task .num{flex:0 0 auto;width:52px;height:52px;border-radius:16px;background:var(--coral-soft);color:var(--coral-ink);font-weight:700;font-size:20px;display:grid;place-items:center}
.task.done .num{background:var(--gold-soft);color:var(--gold)}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-size:20px}
.task .tt b span{color:var(--muted);font-weight:500;margin-left:10px;padding-left:10px;border-left:2px solid var(--coral)}
.task .tt small{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.task .st{flex:0 0 auto;font-weight:700;font-size:15px;color:var(--coral-ink)}
.task .st.ok{color:var(--ok)}
.chip-wrong{border:0;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px;border-radius:99px;padding:6px 12px;cursor:pointer;margin-left:8px}

/* quiz */
.qhead{display:flex;justify-content:space-between;gap:18px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{font-size:13px;font-weight:700;background:var(--gold-soft);color:#9a6b12;border-radius:99px;padding:5px 12px}
.pill.re{background:var(--bad-soft);color:var(--bad)}
.qhead h2{font-size:clamp(30px,4.2vw,50px);font-weight:900;margin:14px 0 6px;line-height:1.1}
.qhead .desc{font-size:16px;color:var(--muted);margin:0}
.qcount{text-align:right;font-size:16px;color:var(--muted);flex:0 0 auto;line-height:1.6}
.streak{display:inline-block;margin-top:8px;background:var(--coral-soft);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--coral-ink)}
.segs{display:flex;gap:8px;margin:26px 0 22px}
.segs i{flex:1;height:7px;border-radius:99px;background:var(--track)}
.segs i.on{background:linear-gradient(90deg,#eab07a,var(--coral))}
.segs i.ok{background:var(--mint)}
.segs i.bad{background:#e79a8a}
.concept{background:var(--gold-soft);border-radius:22px;padding:16px 24px;margin-bottom:24px}
.concept b{display:block;font-size:13px;letter-spacing:.06em;color:#9a6b12;margin-bottom:4px}
.concept p{margin:0;font-size:16px;line-height:1.7}
.passage{background:var(--card);border:2px solid var(--card-line);border-radius:22px;padding:18px 24px;font-size:16px;line-height:1.95;max-height:260px;overflow:auto;margin-bottom:22px}
.passage p{margin:0 0 10px}
.passage .gap{display:inline-block;min-width:64px;text-align:center;font-weight:700;color:var(--muted);border-bottom:2px solid var(--muted);margin:0 3px;padding:0 6px}
.passage .gap.cur{color:var(--coral-ink);border-color:var(--coral);background:var(--coral-soft);border-radius:6px 6px 0 0}
.qtext{font-size:clamp(22px,2.8vw,32px);font-weight:700;line-height:1.5;margin:0 0 8px}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--coral);margin:0 6px;vertical-align:baseline;height:1em}
.lt{color:var(--coral-ink)}
.keys{font-size:14px;color:var(--muted);margin:0 0 20px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:2px solid var(--card-line);background:var(--card);border-radius:20px;padding:14px 20px;font-size:18px;cursor:pointer;transition:border-color .15s}
.opt:hover:not([disabled]){border-color:var(--coral)}
.opt .k{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--coral-soft);color:var(--coral-ink);font-weight:700;display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.typ{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.typ input{flex:1;min-width:220px;font:inherit;font-size:22px;color:var(--ink);background:var(--card);border:2px solid var(--card-line);border-radius:18px;padding:14px 18px}
.typ input:focus{outline:none;border-color:var(--coral)}
.typ input.ok{border-color:var(--ok);background:var(--ok-soft)}
.typ input.bad{border-color:var(--bad);background:var(--bad-soft)}
.hintline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 16px;font-size:16px;color:var(--muted)}
.hintline .zh{background:var(--mint-soft);color:var(--ink);border-radius:99px;padding:5px 14px;font-weight:700}
.hintline .mask{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;font-size:18px;color:var(--ink)}
.more{border:0;background:var(--gold-soft);color:#9a6b12;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer}
.ordbox{min-height:76px;border:2px dashed var(--card-line);border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;background:var(--card)}
.ordbox.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.ordbox.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.ordbox .ph{color:var(--muted);font-size:15px;padding:0 8px}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:52px}
.chunk{border:2px solid var(--card-line);background:var(--sheet);border-radius:14px;padding:10px 16px;font-size:18px;cursor:pointer;touch-action:none}
.chunk:hover{border-color:var(--coral)}
.ordbox .chunk{background:var(--coral-soft);border-color:transparent}
.chunk.dragging{opacity:.4}
.fb{margin-top:20px;border-radius:20px;padding:16px 22px;font-size:16px;line-height:1.75}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{font-size:17px}
.fb.ok b{color:var(--ok)}
.fb.bad b{color:var(--bad)}

R2:{name:'趣味交通實驗室',en:'Having Fun with Change',icon:'🚦',tint:'#f6dcd2',
 lead:'一篇說明文：想讓人改掉壞習慣不容易，答案其實很簡單——讓改變變得好玩。',
 learn:['開頭：大多數人都有想改的習慣，但改變不容易；答案是讓人「有樂趣」。',
  '例子一：葡萄牙里斯本的「跳舞小紅人」紅綠燈，小紅人的舞步由附近小隔間裡的人表演，結果多了 81% 的行人願意停下來等紅燈。',
  '例子二：瑞典斯德哥爾摩地鐵站把樓梯改成會發出聲音的鋼琴鍵，選擇走樓梯的人增加了 66%。',
  '結論：讓日常活動變有趣，大家就樂意參與；這些改變能促進正面行為，也讓人微笑。'],
 words:[['positive','adj.','正面的',''],['signal','n.','指示燈號',''],['improve','v.','改善','improve road safety'],['intersection','n.','十字路口',''],
  ['actually','adv.','事實上',''],['pedestrian','n.','行人',''],['routine','n.','日常事務；例行公事','daily routine'],['experiment','n.','嘗試；實驗','conduct an experiment'],
  ['escalator','n.','電扶梯',''],['ordinary','adj.','普通的',''],['motivate','v.','激勵','be motivated to VR'],['promote','v.','促進','promote positive behavior']],
 phrases:[['for the better','好轉'],['take action','採取行動'],['put up','設立；設置'],['thanks to','幸虧'],['rather than','而非']],
 patterns:[{f:'Introduction → Body → Conclusion',n:'說明文三段結構：開頭提出主旨，中間用例子支持，結尾回到主旨。',ex:'Fortunately, the answer, which is quite simple, is to let them have fun!'},
  {f:'找代名詞與承接語',n:'Its、To achieve this、Each key 這類字都在指前面出現過的東西，空格前後要接得上。',ex:'Its dance moves were actually performed by a person in a nearby booth.'}],
 tips:['篇章結構題先讀空格前後兩句，再看選項的代名詞指誰。','問句後面的空格，常常就是答案或主旨句。','結論段開頭常是「總結前面例子」的句子。','誤選項通常內容沒在文章出現，或讓下一句接不上。'],
 levels:[
  {name:'篇章結構',en:'Fun with change',desc:'把四個句子放回正確位置。',cloze:true,structure:true,
   passage:'Most people have habits that they would like to change for the better. However, such changes are not always easy to make. So how can we make people more eager to take action and make positive changes? {1}\n\nLet’s look at a common part of daily life: crossing the street. People often ignore the “red man” light signal, which can cause accidents. To improve road safety, a car company put up a new kind of traffic light at an intersection in Lisbon, Portugal. When the light turned from green to red, a special red man started to dance. {2} Anyone could enter the booth, choose some music, and dance. Thanks to this creative idea, 81% more pedestrians began to stop at the red light.\n\nAt a crowded subway station in Stockholm, Sweden, another fun twist was added to daily life. The goal of the experiment was to have people use the stairs rather than the escalator. {3} Each key would actually produce a sound when someone stepped on it. Before this, people would head straight for the escalator. After the change, the number of people who chose the stairs went up by 66%.\n\n{4} When ordinary activities become more interesting, most people are happy to join in the fun. The rewards of these changes can be big or small. The important thing is that they promote positive behavior and help to make people smile.',
   shared:['People can add an exciting spark to their daily routines in many creative ways.','To achieve this, ordinary stairs were changed to look like giant piano keys.','As a result, the escalator in the station was removed for safety reasons.','Fortunately, the answer is quite simple: let them have fun!','Its dance moves were actually performed by a person in a nearby booth.'],
   qs:[{b:1,tag:'主旨句',a:3,clue:'前一句是問句 how can we…?，空格要給出答案，也就是全文主旨。'},
    {b:2,tag:'代名詞',a:4,clue:'Its 指前一句的 red man；下一句的 the booth 需要前面先提到 booth。'},
    {b:3,tag:'承接語',a:1,clue:'To achieve this 承接前一句的 goal；下一句的 Each key 需要先出現 piano keys。'},
    {b:4,tag:'結論句',a:0,clue:'結論段開頭總結前面兩個例子，回到主旨。'}]}
 ]},

STN:{mag:true,unit:'UNIT 6',name:'巨石陣與上下文線索',en:'Context Clues · Celebrating Stonehenge',icon:'🗿',tint:'#e6e1d6',
 lead:'讀門秘笈：遇到生字先別查字典，用前後文猜字義；再用〈Celebrating Stonehenge〉實際練習。',
 learn:['四種上下文線索：①直接給定義（Carnivorous animals are those that eat only meat）②邏輯推理（flew、nest → osprey 是一種鳥）③同義線索（on his own → introvert 是喜歡獨處的人）④反義線索（but → fussy eater 和什麼都吃相反）。',
  '巨石陣位於英格蘭西南部寧靜的鄉間，建於新石器時代，大約有 5,000 年歷史，常出現在電影、音樂和書裡。',
  '用途不確定：有人推論是權貴的墓地，也有人認為是追蹤太陽和月亮移動的曆法；石頭巨大又難搬運，可見對建造者很重要。',
  '每年超過一百萬人造訪；最熱門的是夏至（一年中白晝最長的一天），巨石正好與日出對齊。'],
 words:[['structure','n.','建築物；結構體',''],['surround','v.','包圍；環繞','be surrounded by'],['reference','v.','提及；引用',''],['calendar','n.','曆法；日曆',''],
  ['transport','v.','運輸；搬運',''],['tranquil','adj.','寧靜的','同義線索：peaceful'],['theorize','v.','提出理論；推論','反義線索：know for certain'],['burial','n.','埋葬','burial place 墓地']],
 phrases:[['come across','偶然遇到'],['rather than','而非'],['work out','想出；理解'],['for certain','確定地'],['serve as','作為；擔任'],['line up with','與…排成一直線']],
 patterns:[{f:'no matter + wh-, S + V',n:'無論…都…；= wh-ever。放句首時後面加逗點。',ex:'No matter why it was built, clearly it was important to the people who built it.'},
  {f:'…N, when + S + V（關係副詞）',n:'先行詞是特定時間時，用非限定的 , when 補充說明。',ex:'…the summer solstice, when the structure lines up perfectly with the sunrise.'},
  {f:'would have + p.p.',n:'對過去情況的推測：「當時應該…」。',ex:'The stones themselves are huge and would have been very difficult to transport.'}],
 links:['L5 單字 surround：It can be found surrounded by green fields。','L6 單字 ancient：one of the most famous ancient structures。','L4 非限定子句：the Neolithic period, which makes it about 5,000 years old。','R2 片語 rather than：Rather than reaching for a dictionary…'],

<script>
(function(){
'use strict';
if(!window.THREE){document.querySelector('#loader p').textContent='3D 地圖載入失敗，請重新整理頁面。';return;}

var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LK=0.27;
var TOP=0.36,GR=2.0,PATH_R=1.62,PATH_W=0.22,D=4.7;
var PATH_IN=PATH_R*Math.cos(Math.PI/6);
var ORDER=['L4','L5','L6','R2'];

/* ---------- storage ---------- */
var STORE_KEY='review-island-2nd-v1';
var S={player:null,levels:{},log:[],outbox:[]};
try{var raw=localStorage.getItem(STORE_KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){S.player=o.player||null;S.levels=o.levels||{};S.log=o.log||[];S.outbox=o.outbox||[];}}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
function lv(id,i){var k=id+'-'+i;return S.levels[k]||(S.levels[k]={attempts:0,best:null,bestTime:null,done:false,wrong:[]});}

var ISL=ORDER.map(function(id){var d=DATA[id];return {id:id,name:d.name,total:d.levels.length,done:0,wrong:false};});
(function layout(){
  var deg=function(a){a*=Math.PI/180;return new THREE.Vector2(Math.sin(a),Math.cos(a));};
  var p=new THREE.Vector2(0,0),pts=[p.clone()];
  [150,90,30].forEach(function(a){p=p.clone().add(deg(a).multiplyScalar(D));pts.push(p);});
  var c=new THREE.Vector2();pts.forEach(function(v){c.add(v);});c.multiplyScalar(1/pts.length);
  pts.forEach(function(v,i){v.sub(c);ISL[i].pos=v;});
})();
var MAGORDER=[['AI',295],['STN',266],['BOT',237],['JE',209],['PP',180],['COR',151],['AG',122],['BN',94],['MH',65]];
var MAG=MAGORDER.map(function(m){var d=DATA[m[0]],a=m[1]*Math.PI/180;return {id:m[0],name:d.name,total:d.levels.length,done:0,wrong:false,mag:true,pos:new THREE.Vector2(Math.sin(a)*11,Math.cos(a)*11)};});
var ALL=ISL.concat(MAG);
function code(id){return DATA[id].mag?'Live':id;}
var CENTER=new THREE.Vector3(0,0,0);

/* ---------- renderer ---------- */
var wrap=document.getElementById('scene');
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.tabIndex=0;wrap.appendChild(renderer.domElement);
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xf4eee3,42,150);
var camera=new THREE.PerspectiveCamera(34,1,0.1,500);

var hemi=new THREE.HemisphereLight(0xeef6fa,0x8f8270,1.3*LK);scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff1de,2.8*LK);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
var sc=sun.shadow.camera;sc.left=-20;sc.right=20;sc.top=22;sc.bottom=-22;sc.near=1;sc.far=90;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.045;sun.shadow.radius=3;
scene.add(sun);scene.add(sun.target);
var fill=new THREE.DirectionalLight(0xbfd6ff,0.35*LK);fill.position.set(-20,14,-16);scene.add(fill);

/* ---------- day / night ---------- */
var KF=[
 [0,'1e2c58','3f4f80','b4c2ff',1.15,'94a2d8','64566a',1.85,1,'5a88b2'],
 [300,'26365f','4c5688','b8c4ff',1.0,'96a4da','66586c',1.85,1,'5c8ab4'],
 [360,'7f8fc4','f6c3a6','ffb48a',1.3,'f3c6b5','6b5a5a',1.1,.55,'8fb7c4'],
 [450,'a9d1ea','fbe6d3','ffe2c4',2.4,'eaf2f6','8a7a68',1.25,0,'9fcfd6'],
 [720,'9fd0ec','f4eee3','fff1de',2.9,'eef6fa','8f8270',1.35,0,'a9d8db'],
 [960,'a6cfe6','f8e7d2','ffe3c0',2.5,'f1efe8','8a7a66',1.25,0,'9fcbd2'],
 [1065,'8b8fc4','f7b98f','ff9f6a',1.8,'f6d2bc','7d6660',1.2,.3,'93a9bd'],
 [1140,'5a5e9e','d99aa6','ff9a7a',1.3,'c0b2e0','655868',1.35,.75,'6a7cab'],
 [1260,'22325f','445488','c0ccff',1.2,'98a8dc','685a6e',1.9,1,'5a88b2'],
 [1440,'1e2c58','3f4f80','b4c2ff',1.15,'94a2d8','64566a',1.85,1,'5a88b2']
].map(function(r){var C=function(h){return new THREE.Color('#'+h);};
  return {m:r[0],top:C(r[1]),hor:C(r[2]),sunC:C(r[3]),sunI:r[4],hs:C(r[5]),hg:C(r[6]),hi:r[7],night:r[8],water:C(r[9])};});
var ENV={top:new THREE.Color(),hor:new THREE.Color(),sunC:new THREE.Color(),sunI:1,hs:new THREE.Color(),hg:new THREE.Color(),hi:1,night:0,water:new THREE.Color()};
function sampleEnv(min){
  min=((min%1440)+1440)%1440;var i=0;while(i<KF.length-2&&KF[i+1].m<=min)i++;
  var a=KF[i],b=KF[i+1],t=(min-a.m)/(b.m-a.m);
  ['top','hor','sunC','hs','hg','water'].forEach(function(k){ENV[k].copy(a[k]).lerp(b[k],t);});
  ENV.sunI=a.sunI+(b.sunI-a.sunI)*t;ENV.hi=a.hi+(b.hi-a.hi)*t;ENV.night=a.night+(b.night-a.night)*t;
}

/* ---------- sky ---------- */
var skyU={uTop:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSunDir:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color()},uNight:{value:0}};
var sky=new THREE.Mesh(new THREE.SphereGeometry(200,32,16),new THREE.ShaderMaterial({
  uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:['uniform vec3 uTop,uHor,uSunCol,uSunDir;uniform float uNight;varying vec3 vW;',
   'void main(){vec3 d=normalize(vW-cameraPosition);float h=clamp(d.y,0.,1.);',
   'vec3 c=mix(uHor,uTop,pow(smoothstep(0.,.85,h),.7));',
   'float s=max(dot(d,normalize(uSunDir)),0.);',
   'c+=uSunCol*(pow(s,48.)*.35+pow(s,6.)*.07)*(1.-uNight*.6);',
   'gl_FragColor=vec4(c,1.);}'].join('\n')
}));
sky.frustumCulled=false;sky.renderOrder=-2;scene.add(sky);
(function(){var n=420,p=new Float32Array(n*3);
  for(var i=0;i<n;i++){var u=Math.random()*Math.PI*2,v=0.12+Math.random()*0.88,r=180,s=Math.sqrt(1-v*v);p[i*3]=Math.cos(u)*s*r;p[i*3+1]=v*r;p[i*3+2]=Math.sin(u)*s*r;}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  var m=new THREE.PointsMaterial({color:0xfff6e0,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false});
  var pts=new THREE.Points(g,m);pts.frustumCulled=false;sky.add(pts);sky.userData.stars=m;})();

/* ---------- water ---------- */
var waterU=THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{
  uTime:{value:0},uTint:{value:new THREE.Color(0xa9d8db)},uNight:{value:0},
  uShallow:{value:new THREE.Color(0xa4d4da)},uDeep:{value:new THREE.Color(0x6fa9b8)},
  uIsl:{value:ALL.map(function(d){return new THREE.Vector3(d.pos.x,d.pos.y,d.mag?0.62:1);})}}]);
var water=new THREE.Mesh(new THREE.CircleGeometry(160,64),new THREE.ShaderMaterial({
  uniforms:waterU,fog:true,
  vertexShader:['#include <fog_pars_vertex>','varying vec2 vW;',
   'void main(){vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xz;vec4 mvPosition=viewMatrix*wp;gl_Position=projectionMatrix*mvPosition;',
   '#include <fog_vertex>','}'].join('\n'),
  fragmentShader:['#include <fog_pars_fragment>',
   'uniform float uTime,uNight;uniform vec3 uTint,uShallow,uDeep;uniform vec3 uIsl[13];varying vec2 vW;',
   'void main(){float d=length(vW);float far=smoothstep(8.,70.,d);',
   'float w1=sin(vW.x*.35+uTime*.4+sin(vW.y*.27+uTime*.25)*1.6);',
   'float w2=sin(vW.y*.42-uTime*.33+sin(vW.x*.21-uTime*.2)*1.4);',
   'float drift=(w1+w2)*.25+.5;',
   'vec3 col=mix(uShallow,uDeep,clamp(far*.85+drift*.18,0.,1.));',
   'float md=1e3;for(int i=0;i<13;i++){md=min(md,length(vW-uIsl[i].xy)/uIsl[i].z);}',
   'float shore=1.-smoothstep(2.4,3.6,md);col=mix(col,vec3(.86,.94,.93),shore*.5);',
   'float ring=1.-smoothstep(0.,.07,abs(md-2.78-.06*sin(uTime*1.2)));col+=ring*.1;',
   'float sp=pow(max(0.,sin(vW.x*3.1+uTime*1.7)*sin(vW.y*2.7-uTime*1.3)),24.)*(1.-far)*.35*(1.-uNight);col+=sp;',
   'col*=uTint/vec3(.663,.847,.859);gl_FragColor=vec4(col,1.);',
   '#include <fog_fragment>','}'].join('\n')
}));
water.rotation.x=-Math.PI/2;scene.add(water);

/* ---------- materials ---------- */
var matCache={};
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:1,metalness:0,flatShading:true},o||{}));}
function MC(c){return matCache[c]||(matCache[c]=M(c));}
var mat={
  grass:M(0xc9d9b4),dirt:M(0x8a5a3c),sand:M(0xefe3cf),path:M(0xebe2d1,{side:THREE.DoubleSide}),
  wood:M(0xb9804f),woodDark:M(0x8f5e38),pole:M(0x3a4644),

var quiz=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(id,li,onlyWrong){

function normalize(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[,.!?]/g,' ').replace(/\s+/g,' ').trim();}

function renderQ(){

    var opts=lev.structure?lev.shared:Q.o;h+='<div class="opts">'+opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="k">'+'ABCDE'[i]+'</span><span>'+esc(o)+'</span></button>';}).join('')+'</div>';}
  else if(t==='mc'){h+='<p class="qtext">'+qHTML(Q.q)+'</p><p class="keys">鍵盤可按 1–4 作答，Enter 下一題</p><div class="opts">'+Q.o.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>';}).join('')+'</div>';}

    '<div class="typ"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入答案" data-autofocus><button class="btn btn-primary" data-act="check">送出</button></div>';}
  else{q.order={placed:[],pool:shuffleNot(Q.c)};h+='<p class="qtext" style="font-size:20px;font-weight:500;color:var(--muted)">'+esc(Q.zh)+'</p><div class="ordbox" id="ordbox"></div><div class="pool" id="pool"></div>'+
    '<div style="margin-top:16px"><button class="btn btn-primary" data-act="check" id="ordCheck" disabled>送出</button></div>';}
  h+='<div id="fb"></div></div><div class="sheet-foot"><span class="grow">'+(S.player?esc(S.player.cls+' 班 '+S.player.seat+' 號 '+S.player.name):'')+'</span><button class="btn btn-ghost" data-act="pack">回到懶人包</button><button class="btn btn-primary" data-act="next" id="btnNext" disabled>下一題</button></div>';
  openSheet(h,'quiz');

function shuffleNot(c){var idx=c.map(function(_,i){return i;}),s=idx;for(var k=0;k<8;k++){s=shuffle(idx);if(s.some(function(v,i){return v!==i;}))break;}return s;}
function curQ(){return quiz.lev.qs[quiz.list[quiz.i]];}
function updMask(){var Q=curQ(),a=Q.a[0],n=quiz.hintN;var out='';for(var i=0;i<a.length;i++){var ch=a[i];out+=ch===' '?'  ':(i<n?ch:'_');}
  var m=sheet.querySelector('#mask');if(m)m.textContent=n?out:'';}
function drawOrder(){var Q=curQ(),o=quiz.order,box=sheet.querySelector('#ordbox'),pool=sheet.querySelector('#pool');
  box.innerHTML=o.placed.length?o.placed.map(function(ci,k){return '<button class="chunk" draggable="true" data-act="unplace" data-k="'+k+'">'+esc(Q.c[ci])+'</button>';}).join(''):'<span class="ph">點下方語塊，依序排成句子</span>';

    el.addEventListener('dragend',function(){el.classList.remove('dragging');});

    el.addEventListener('drop',function(e){e.preventDefault();var from=+e.dataTransfer.getData('text/plain'),to=+el.dataset.k;if(isNaN(from)||from===to)return;

function answer(ok,detail){var q=quiz;q.answered=true;q.res[q.i]=ok;

  var nb=sheet.querySelector('#btnNext');nb.disabled=false;nb.textContent=q.i===q.list.length-1?'看結果':'下一題';nb.focus({preventScroll:true});

function pickOpt(i){if(quiz.answered)return;var lev=quiz.lev,Q=curQ(),a=Q.a,opts=lev.structure?lev.shared:Q.o;
  var els=sheet.querySelectorAll('.opt');els.forEach(function(e){e.disabled=true;});els[a].classList.add('ok');if(i!==a)els[i].classList.add('bad');

function checkType(){if(quiz.answered)return;var inp=sheet.querySelector('#ans'),v=normalize(inp.value);if(!v){inp.focus();return;}

function checkOrder(){if(quiz.answered)return;var Q=curQ(),o=quiz.order,ok=o.placed.every(function(v,i){return v===i;});

function nextQ(){if(!quiz||!quiz.answered)return;if(quiz.i<quiz.list.length-1){quiz.i++;renderQ();}else finishQuiz();}
function finishQuiz(){var q=quiz,L=lv(q.id,q.li),secs=(performance.now()-q.t0)/1000,total=q.list.length,wasDone=L.done;
  L.attempts++;

    level:q.lev.name+(q.retry?'（錯題重練）':''),score:q.score,total:total,seconds:Math.round(secs),
    wrong:q.wrongNow.map(function(qi){var Q=q.lev.qs[qi];return (qi+1)+'. '+(q.lev.cloze?'第('+Q.b+')格':(Q.q||Q.zh||''));})});

  var msg=L.done?(isl.done===isl.total?(isl.mag?isl.name:q.id)+' 全島點亮，旗子升起來了。':'水晶亮起來了，繼續下一關。'):'答錯的題目已經存成錯題，重練答對就能點亮水晶。';

/* ---------- sheet events ---------- */
function islandOfSheet(){if(quiz)return quiz.id;var m=(sheetMode||'').split(':');return m[1]||sheet.dataset.isl;}
sheet.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-say]');if(!b)return;
  if(b.dataset.say){speak(b.dataset.say);b.classList.add('say');setTimeout(function(){b.classList.remove('say');},180);return;}
  var act=b.dataset.act,id=islandOfSheet();
  if(act==='close'){closeSheet();}
  else if(act==='login'){doLogin();}
  else if(act==='cert'){openCert();}
  else if(act==='log'){openLog();}
  else if(act==='resend'){flushOutbox();toast('正在重新上傳紀錄…');setTimeout(function(){if(sheetMode==='log')openLog();},1500);}
  else if(act==='reset'){if(window.confirm('確定要清除所有作答紀錄，重新開始嗎？')){S.levels={};save();refreshProgress();doLogin();}}
  else if(act==='start'){e.stopPropagation();startQuiz(id,+b.dataset.i,false);}
  else if(act==='retry'){e.stopPropagation();startQuiz(id,+b.dataset.i,true);}
  else if(act==='pack'){quiz=null;openPack(id);}
  else if(act==='pick'){pickOpt(+b.dataset.i);}
  else if(act==='check'){var t=quiz&&(curQ().t||'mc');if(t==='type')checkType();else if(t==='order')checkOrder();}
  else if(act==='more'){if(quiz.answered)return;var a=curQ().a[0];if(quiz.hintN<a.length){quiz.hintN++;while(a[quiz.hintN-1]===' '&&quiz.hintN<a.length)quiz.hintN++;updMask();}}
  else if(act==='next'){nextQ();}
  else if(act==='place'){if(quiz.answered)return;var o=quiz.order,v=o.pool.splice(+b.dataset.k,1)[0];o.placed.push(v);drawOrder();}
  else if(act==='unplace'){if(quiz.answered)return;var o2=quiz.order,v2=o2.placed.splice(+b.dataset.k,1)[0];o2.pool.push(v2);drawOrder();}
});
sheet.addEventListener('keydown',function(e){var b=e.target.closest('.chip-wrong');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();startQuiz(islandOfSheet(),+b.dataset.i,true);}});

window.addEventListener('keydown',function(e){
  var t=e.target,inInput=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
  if(!scrim.hidden){
    if(e.key==='Escape'&&sheetMode!=='login'){e.preventDefault();closeSheet();return;}
    if(sheetMode==='login'&&e.key==='Enter'){e.preventDefault();doLogin();return;}
    if(quiz){var Q=curQ(),ty=quiz.lev.cloze?'mc':(Q.t||'mc');
      if(e.key==='Enter'){ if(quiz.answered){e.preventDefault();nextQ();}else if(ty==='type'&&inInput){e.preventDefault();checkType();} return;}
      if(ty==='mc'&&!quiz.answered&&!inInput){var n=quiz.lev.structure?5:4,k=e.key.toUpperCase(),idx=-1;
        if(/^[1-9]$/.test(k))idx=+k-1;else if('ABCDE'.indexOf(k)>=0&&k.length===1)idx='ABCDE'.indexOf(k);
        if(idx>=0&&idx<n){e.preventDefault();pickOpt(idx);}}
    }
    return;
  }
  if(inInput)return;var used=true;
  if(e.key==='ArrowLeft')want.theta+=0.12;else if(e.key==='ArrowRight')want.theta-=0.12;
  else if(e.key==='ArrowUp')want.radius=clamp(want.radius*0.9,6,52);else if(e.key==='ArrowDown')want.radius=clamp(want.radius*1.1,6,52);else used=false;
  if(used){e.preventDefault();exitBird();kick();}
});

/* ---------- spreadsheet outbox ---------- */
var flushing=false;
function gas(){return !!(window.google&&google.script&&google.script.run);}
function hasSink(){return !!window.SHEET_URL||gas();}
function queueRecord(rec){if(!hasSink())return;rec.sentAt=new Date().toISOString();S.outbox.push(rec);if(S.outbox.length>200)S.outbox=S.outbox.slice(-200);}
function flushOutbox(){if(!hasSink()||flushing||!S.outbox.length)return;flushing=true;var rec=S.outbox[0];
  var ok=function(){S.outbox.shift();save();flushing=false;flushOutbox();},bad=function(){flushing=false;};
  if(gas()){google.script.run.withSuccessHandler(ok).withFailureHandler(bad).saveRecord(rec);return;}
  if(!window.fetch){flushing=false;return;}
  fetch(window.SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}).then(ok).catch(bad);}

/* ---------- City Log ---------- */
function allDone(){return ISL.every(function(d){return d.done===d.total;});}
function stamp(t){var d=new Date(t),p=function(n){return (n<10?'0':'')+n;};return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function openLog(){
  var logs=S.log||[],secs=0,doneN=0,all=0,bestS=0,allQ=0,rows='';
  logs.forEach(function(e){secs+=e.secs||0;});
  ALL.forEach(function(d){DATA[d.id].levels.forEach(function(lev,i){var L=S.levels[d.id+'-'+i]||{};all++;allQ+=lev.qs.length;if(L.done)doneN++;if(L.best!=null)bestS+=L.best;
    var st=L.done?'<span class="st-ok">已點亮</span>':(L.attempts?'<span class="st-bad">待重練 '+(L.wrong?L.wrong.length:0)+'</span>':'<span class="st-none">未開始</span>');
    rows+='<tr><td>'+(d.mag?esc(d.name):d.id)+'</td><td>'+esc(lev.name)+'</td><td class="num">'+(L.best!=null?L.best+'/'+lev.qs.length:'—')+'</td><td class="num">'+(L.bestTime?fmtT(L.bestTime):'—')+'</td><td class="num">'+(L.attempts||0)+'</td><td>'+st+'</td></tr>';});});
  var recent=logs.slice(-15).reverse().map(function(e){var lev=DATA[e.id].levels[e.li];
    return '<tr><td class="num">'+stamp(e.t)+'</td><td>'+(DATA[e.id].mag?esc(DATA[e.id].name):e.id)+' '+esc(lev.name)+(e.retry?'（錯題重練）':'')+'</td><td class="num">'+e.score+'/'+e.total+'</td><td class="num">'+fmtT(e.secs)+'</td></tr>';}).join('');
  var who=S.player?esc(S.player.name)+' 的學習日誌':'學習日誌';
  var pend=hasSink()&&S.outbox.length?'<div class="pend">還有 '+S.outbox.length+' 筆紀錄等待上傳到老師的試算表。<button class="more" data-act="resend">重新上傳</button></div>':'';
  openSheet('<div class="sheet-body">'+X+'<p class="eyebrow">CITY LOG</p><h2 id="sheetTitle" style="font-size:clamp(30px,4vw,46px);font-weight:900;margin:12px 0 6px">'+who+'</h2>'+
    '<p class="desc" style="font-size:16px;color:var(--muted);margin:0">'+(S.player?esc(S.player.cls+' 班 '+S.player.seat+' 號'):'')+'</p>'+
    '<div class="res-big"><div><b>'+doneN+'/'+all+'</b><span>點亮的水晶</span></div><div><b>'+logs.length+'</b><span>作答次數</span></div><div><b>'+fmtT(secs)+'</b><span>累計作答時間</span></div><div><b>'+(allQ?Math.round(bestS/allQ*100):0)+'%</b><span>最佳紀錄答對率</span></div></div>'+pend+
    '<div class="sec"><i>🗺️</i><h3>各關紀錄</h3></div><div class="tbl-wrap"><table class="ltable"><thead><tr><th>島</th><th>關卡</th><th>最佳</th><th>最佳時間</th><th>次數</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="sec"><i>🕒</i><h3>最近作答</h3></div>'+(recent?'<div class="tbl-wrap"><table class="ltable"><thead><tr><th>時間</th><th>關卡</th><th>答對</th><th>用時</th></tr></thead><tbody>'+recent+'</tbody></table></div>':'<p class="say-note" style="font-size:15px">還沒有作答紀錄，點一座島開始吧。</p>')+
    '</div><div class="sheet-foot"><button class="btn btn-ghost" data-act="close">回到地圖</button>'+(allDone()?'<button class="btn btn-primary" data-act="cert">領取證書</button>':'')+'</div>','log');
}

/* ---------- certificate ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawCert(){
  var W=1600,Hh=1130,cv=document.createElement('canvas');cv.width=W;cv.height=Hh;var g=cv.getContext('2d'),F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',p=S.player;
  g.fillStyle='#fffaf3';g.fillRect(0,0,W,Hh);
  g.fillStyle='#e8f3ef';g.beginPath();g.arc(1470,130,230,0,7);g.fill();g.fillStyle='#fbe9e0';g.beginPath();g.arc(120,1050,250,0,7);g.fill();
  g.fillStyle='#fdf1d4';g.beginPath();g.arc(1380,1000,120,0,7);g.fill();
  rr(g,40,40,W-80,Hh-80,40);g.lineWidth=6;g.strokeStyle='#e07a55';g.stroke();rr(g,64,64,W-128,Hh-128,30);g.lineWidth=2;g.strokeStyle='#f0c8b4';g.stroke();
  g.textAlign='center';g.fillStyle='#c25a35';g.font='700 26px '+F;g.fillText('T H E   R E V I E W   I N D E X',W/2,170);
  g.fillStyle='#2b2622';g.font='900 88px '+F;g.fillText('第二次段考複習島',W/2,280);
  g.fillStyle='#7a6f66';g.font='500 34px '+F;g.fillText('完成證書',W/2,340);
  g.font='400 30px '+F;g.fillText('頒發給',W/2,430);
  g.fillStyle='#2b2622';g.font='900 110px '+F;g.fillText(p.name,W/2,560);
  g.fillStyle='#7a6f66';g.font='500 32px '+F;g.fillText(p.cls+' 班　'+p.seat+' 號',W/2,620);
  g.fillStyle='#2b2622';g.font='400 32px '+F;g.fillText('完成 L4–L6 與 R2 共 13 個複習任務，點亮了全部水晶。',W/2,700);
  var x=110,secs=0;(S.log||[]).forEach(function(e){secs+=e.secs||0;});
  ISL.forEach(function(d){var data=DATA[d.id],b=0,t=0;data.levels.forEach(function(lev,i){var L=S.levels[d.id+'-'+i]||{};b+=L.best||0;t+=lev.qs.length;});
    rr(g,x,760,330,150,26);g.fillStyle=data.tint;g.fill();
    g.textAlign='left';g.fillStyle='#c25a35';g.font='700 30px '+F;g.fillText(d.id,x+28,812);
    g.fillStyle='#2b2622';g.font='700 28px '+F;g.fillText(d.name,x+28,856);
    g.fillStyle='#7a6f66';g.font='500 24px '+F;g.fillText('最佳答對 '+b+'/'+t,x+28,892);x+=350;});
  var md=0,mt=0;MAG.forEach(function(d){md+=d.done;mt+=d.total;});g.textAlign='center';g.fillStyle='#3f8f6b';g.font='700 26px '+F;g.fillText('Live 雜誌島加碼練習　'+md+'/'+mt,W/2,962);
  g.textAlign='left';g.fillStyle='#7a6f66';g.font='500 26px '+F;var dt=new Date();
  g.fillText('日期　'+dt.getFullYear()+'/'+(dt.getMonth()+1)+'/'+dt.getDate(),110,1010);
  g.textAlign='right';g.fillText('累計作答時間　'+fmtT(secs),W-110,1010);
  return cv.toDataURL('image/png');
}
function openCert(){
  if(!S.player){openLogin();return;}
  var left=[];ISL.forEach(function(d){DATA[d.id].levels.forEach(function(lev,i){var L=S.levels[d.id+'-'+i];if(!L||!L.done)left.push(d.id+' '+lev.name);});});
  if(left.length){openSheet('<div class="sheet-body">'+X+'<p class="eyebrow">CERTIFICATE</p><h2 id="sheetTitle" style="font-size:clamp(28px,3.6vw,42px);font-weight:900;margin:12px 0 8px">證書還沒解鎖</h2>'+
    '<p style="font-size:17px;color:var(--muted);margin:0">再完成 '+left.length+' 關、點亮全部 13 顆水晶，就能領取完成證書。</p><ul class="left-list">'+left.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>'+
    '<div class="sheet-foot"><button class="btn btn-primary" data-act="close">繼續複習</button></div>','cert',true);return;}
  openSheet('<div class="sheet-body">'+X+'<p class="eyebrow">CERTIFICATE</p><h2 id="sheetTitle" style="font-size:clamp(28px,3.6vw,42px);font-weight:900;margin:12px 0 8px">恭喜完成全部 13 關！</h2>'+
    '<p style="font-size:17px;color:var(--muted);margin:0">這是你的完成證書，可以下載保存或給老師看。</p><p class="say-note" id="certBox">證書產生中…</p></div>'+
    '<div class="sheet-foot"><span class="grow">下載沒有反應時，可以在圖片上按右鍵或長按另存。</span><button class="btn btn-ghost" data-act="close">回到地圖</button><a class="btn btn-primary" id="certDl" href="#" download="複習島證書.png">下載證書</a></div>','cert',true);
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  ready.then(function(){var url=drawCert(),box=sheet.querySelector('#certBox');if(!box)return;
    box.outerHTML='<img class="cert-img" alt="'+esc(S.player.name)+' 的完成證書" src="'+url+'">';
    var a=sheet.querySelector('#certDl');a.href=url;a.download='複習島證書-'+S.player.name+'.png';});
}

function openIsland(id){var d=ALL.find(function(x){return x.id===id;});if(!d)return;exitBird();
  setWant({target:new THREE.Vector3(d.pos.x,0.4,d.pos.y),theta:want.theta,phi:0.92,radius:d.mag?7.5:10.5});
  if(!S.player){openLogin();return;}
  setTimeout(function(){openPack(id);},reduced?0:380);}
window.openIsland=openIsland;

/* ---------- labels ---------- */
var proj=new THREE.Vector3();
function placeTags(){var w=window.innerWidth,h=window.innerHeight;
  ALL.forEach(function(d){proj.set(d.pos.x,(d.mag?TOP*0.62+1.05:TOP+1.5)+d.lift,d.pos.y).project(camera);
    var vis=proj.z<1&&proj.x>-1.2&&proj.x<1.2&&proj.y>-1.2&&proj.y<1.2;d.tag.style.visibility=vis?'visible':'hidden';
    d.tag.style.transform='translate('+((proj.x*0.5+0.5)*w)+'px,'+((-proj.y*0.5+0.5)*h)+'px) translate(-50%,-100%)';
    d.tag.style.zIndex=String(Math.round((1-proj.z)*1000));d.tag.classList.toggle('is-hover',hoverId===d.id);});}

function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();kick();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.body);else window.addEventListener('resize',resize);
resize();

/* ---------- loop ---------- */
var dirty=true,last=performance.now(),firstFrame=true,elapsed=0;
function kick(){dirty=true;}
function step(c,t,f){return c+(t-c)*f;}
function frame(now){requestAnimationFrame(frame);if(document.hidden){last=now;return;}
  var dt=Math.min((now-last)/1000,0.08);last=now;elapsed+=dt;var active=false;
  if(clockOn&&!clockHold){minutes=(minutes+dt*10)%1440;active=true;}
  var f=1-Math.exp(-dt*(reduced?40:7)),moving=false;
  ctl.theta=step(ctl.theta,want.theta,f);ctl.phi=step(ctl.phi,want.phi,f);ctl.radius=step(ctl.radius,want.radius,f);ctl.target.lerp(want.target,f);
  if(Math.abs(ctl.theta-want.theta)>1e-4||Math.abs(ctl.phi-want.phi)>1e-4||Math.abs(ctl.radius-want.radius)>1e-3||ctl.target.distanceToSquared(want.target)>1e-6)moving=true;
  if(hoverDirty&&pointerInside&&ptrs.size===0&&scrim.hidden){hoverDirty=false;var hp=pick(),id=hp?hp.id:null;if(id!==hoverId){hoverId=id;cvs.style.cursor=id?'pointer':'grab';}}
  var g=1-Math.exp(-dt*10);
  ALL.forEach(function(d){var goal=hoverId===d.id?1:0;d.hover=step(d.hover,goal,g);if(Math.abs(d.hover-goal)>1e-3)moving=true;
    d.lift=d.hover*0.08;d.body.position.y=d.lift;d.outline.material.opacity=d.hover*0.85;
    if(d.flag){var fy=step(d.flag.position.y,d.flagY,1-Math.exp(-dt*2));if(Math.abs(fy-d.flagY)>1e-3)moving=true;d.flag.position.y=fy;}
    d.crystals.forEach(function(c,i){if(c.userData.on&&!reduced){c.rotation.y+=dt*1.2;c.position.y=.24+Math.sin(elapsed*2+i)*.025;}});});
  if(!reduced){waterU.uTime.value+=dt;routeTime.value+=dt;active=true;
    clouds.forEach(function(c){c.position.x+=dt*c.userData.v;if(c.position.x>95)c.position.x=-95;});
    boats.forEach(function(b){var u=b.userData;u.a+=dt*u.s;b.position.set(Math.cos(u.a)*u.r,Math.sin(elapsed*1.3+u.ph)*0.04,Math.sin(u.a)*u.r*0.8);b.rotation.y=-u.a;b.rotation.z=Math.sin(elapsed*1.1+u.ph)*0.04;});}
  if(!(active||moving||dirty))return;dirty=false;
  applyEnv();applyCam();sky.position.copy(camera.position);updateWalkers(dt,elapsed);updateRoutes();placeTags();renderer.render(scene,camera);
  if(firstFrame){firstFrame=false;document.getElementById('loader').classList.add('done');if(!S.player)setTimeout(openLogin,500);}}
boats.forEach(function(b){var u=b.userData;b.position.set(Math.cos(u.a)*u.r,0,Math.sin(u.a)*u.r*0.8);});
syncPlayer();refreshProgress();flushOutbox();
requestAnimationFrame(frame);
})();
</script>
